name: RC4 Protocol V9 Test Fix Once

on:
  push:
    branches:
      - 'fix/rc4-wildcard-acme'

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'ci: fix rc4 protocol v9 test' }}"
    runs-on: ubuntu-24.04
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix shared protocol v9 assertions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/shared/src/protocol.rs')
          s = p.read_text()

          old = '        assert_eq!(CONFIG_PROTOCOL_VERSION, 8);'
          if s.count(old) != 2:
              raise SystemExit(f'expected exactly two stale v8 assertions, found {s.count(old)}')
          s = s.replace(old, '        assert_eq!(CONFIG_PROTOCOL_VERSION, 9);')

          old_name = 'fn omitted_acme_challenge_method_remains_http01_on_protocol_v8()'
          new_name = 'fn omitted_acme_challenge_method_remains_http01_on_protocol_v9()'
          if s.count(old_name) != 1:
              raise SystemExit('ACME protocol test name anchor mismatch')
          s = s.replace(old_name, new_name, 1)

          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p relay-shared --lib --locked

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/shared/src/protocol.rs
          git diff --cached --check
          git commit -m 'test: 修正配置协议 v9 共享断言'
          git push origin HEAD:fix/rc4-wildcard-acme
