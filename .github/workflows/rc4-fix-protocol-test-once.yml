name: RC4 Protocol V9 Test Fix Once

on:
  push:
    branches:
      - 'fix/rc4-wildcard-acme'

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'ci: fix rc4 protocol v9 test' }}"
    runs-on: ubuntu-24.04
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix protocol test and imports
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/panel/src/api/node.rs')
          s = p.read_text()
          old = '''    #[test]\n    fn config_protocol_v7_is_rejected_and_v8_is_accepted() {\n        let mut v7 = HeaderMap::new();\n        v7.insert("X-Config-Protocol-Version", "7".parse().unwrap());\n        assert!(!config_protocol_compatible(&v7));\n\n        let mut v8 = HeaderMap::new();\n        v8.insert("X-Config-Protocol-Version", "8".parse().unwrap());\n        assert!(config_protocol_compatible(&v8));\n        assert!(!config_protocol_compatible(&HeaderMap::new()));\n    }'''
          new = '''    #[test]\n    fn config_protocol_v8_is_rejected_and_v9_is_accepted() {\n        let mut v8 = HeaderMap::new();\n        v8.insert("X-Config-Protocol-Version", "8".parse().unwrap());\n        assert!(!config_protocol_compatible(&v8));\n\n        let mut v9 = HeaderMap::new();\n        v9.insert("X-Config-Protocol-Version", "9".parse().unwrap());\n        assert!(config_protocol_compatible(&v9));\n        assert!(!config_protocol_compatible(&HeaderMap::new()));\n    }'''
          if s.count(old) != 1:
              raise SystemExit('protocol test anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          p = Path('crates/panel/src/service/node_config.rs')
          s = p.read_text()
          old = '''use crate::db::repo::{\n    DnsRecordBindingRepository, DnsRecordSyncRepository, GroupRepository, ProfileScope,\n    ResourceScope, TunnelProfileRepository,\n};'''
          new = '''use crate::db::repo::{GroupRepository, ProfileScope, ResourceScope, TunnelProfileRepository};'''
          if s.count(old) != 1:
              raise SystemExit('import anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p relay-panel config_protocol_v8_is_rejected_and_v9_is_accepted -- --nocapture

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/panel/src/api/node.rs crates/panel/src/service/node_config.rs
          git diff --cached --check
          git commit -m 'test: 更新配置协议 v9 兼容性断言'
          git push origin HEAD:fix/rc4-wildcard-acme
