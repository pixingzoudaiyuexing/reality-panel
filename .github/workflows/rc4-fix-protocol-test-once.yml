name: RC4 Protocol V9 Test Fix Once

on:
  push:
    branches:
      - 'fix/rc4-wildcard-acme'

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'ci: fix rc4 protocol v9 test' }}"
    runs-on: ubuntu-24.04
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump rc4 package versions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          for name in ['crates/panel/Cargo.toml', 'crates/node/Cargo.toml']:
              p = Path(name)
              s = p.read_text()
              old = 'version = "1.1.0-rc.3"'
              if s.count(old) != 1:
                  raise SystemExit(f'{name}: expected one rc.3 version')
              p.write_text(s.replace(old, 'version = "1.1.0-rc.4"', 1))
          PY
          cargo check --workspace
          bash scripts/release-version-contract.sh v1.1.0-rc.4
          cargo check --workspace --locked

      - name: Commit rc4 version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/panel/Cargo.toml crates/node/Cargo.toml Cargo.lock
          git diff --cached --check
          git commit -m 'release: 准备 v1.1.0-rc.4 版本号'
          git push origin HEAD:fix/rc4-wildcard-acme
