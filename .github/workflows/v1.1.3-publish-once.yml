name: Publish v1.1.3 Lifecycle Hotfix Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v1.1.3-publish-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: reality-panel-v1.1.3-lifecycle-hotfix-once
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.1.3
  RELEASE_TAG: v1.1.3
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    name: Apply lifecycle hotfix and dispatch release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard immutable release
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag $RELEASE_TAG already exists; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.guard.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates pkg-config libssl-dev libssh2-1-dev zlib1g-dev

      - name: Prepare source hotfix
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-v1.1.3.py
          cargo fmt --all
          git diff --check
          bash scripts/release-version-contract.sh "$RELEASE_TAG"
          bash scripts/release-version-contract.test.sh "$RELEASE_TAG"
          bash scripts/release-check.sh "$RELEASE_VERSION"

      - name: Validate lifecycle hotfix
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test -p relay-panel --locked node_ops::tests

      - name: Commit v1.1.3 source
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1.1.3-publish-once.yml .github/scripts/prepare-v1.1.3.py
          git add crates/panel/src/api/node_ops.rs crates/panel/Cargo.toml crates/node/Cargo.toml Cargo.lock scripts/relay-node-install.sh scripts/release-version-contract.test.sh CHANGELOG.md CHANGELOG-NODE.md docs/VERSIONS.md README.md
          git diff --cached --check
          git commit -m "fix: release v1.1.3 lifecycle confirmation hotfix"
          git push origin HEAD:main

      - name: Create immutable v1.1.3 tag
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG unexpectedly appeared during publication" >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Reality Panel $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch binary release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run binary-release.yml --ref "$RELEASE_TAG"

      - name: Summary
        if: steps.guard.outputs.publish == 'true'
        run: |
          echo "v1.1.3 source/tag prepared; binary release dispatched." >> "$GITHUB_STEP_SUMMARY"
