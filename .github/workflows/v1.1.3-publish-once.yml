name: Publish v1.1.3 Lifecycle Hotfix Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v1.1.3-publish-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: reality-panel-v1.1.3-lifecycle-hotfix-once
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.1.3
  RELEASE_TAG: v1.1.3
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    name: Apply lifecycle hotfix and dispatch verified release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether publication is still needed
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag $RELEASE_TAG already exists; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install release dependencies
        if: steps.guard.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates file openssl sqlite3 pkg-config libssl-dev libssh2-1-dev zlib1g-dev

      - name: Install Rust toolchain
        if: steps.guard.outputs.publish == 'true'
        run: rustup show

      - name: Install Node.js
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply lifecycle hotfix and prepare v1.1.3
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{path}: expected at least one match: {old!r}")
              p.write_text(text.replace(old, new))

          node_ops = "crates/panel/src/api/node_ops.rs"

          replace_once(
              node_ops,
              '''                    if event.action == NodeLifecycleAction::Upgrade
                        && event.node_version.as_deref()
                            != entry.operation.target_version.as_deref()
                    {
                        if entry.saw_disconnect {
                            entry.operation.status = OperationStatus::Failed;
                            entry.operation.message = format!(
                                "relay-node restarted with version {}, expected {}",
                                event.node_version.as_deref().unwrap_or("unknown"),
                                entry
                                    .operation
                                    .target_version
                                    .as_deref()
                                    .unwrap_or("unknown")
                            );
                            entry.operation.updated_at = now();
                            return LifecycleEventOutcome {
                                operation: Some(entry.operation.clone()),
                                boot_ack: Some(lifecycle_ack(&event)),
                            };
                        }
                        return LifecycleEventOutcome::default();
                    }
''',
              '''                    if event.action == NodeLifecycleAction::Upgrade
                        && event.node_version.as_deref()
                            != entry.operation.target_version.as_deref()
                    {
                        entry.operation.status = OperationStatus::Failed;
                        entry.operation.message = format!(
                            "relay-node restarted with version {}, expected {}",
                            event.node_version.as_deref().unwrap_or("unknown"),
                            entry
                                .operation
                                .target_version
                                .as_deref()
                                .unwrap_or("unknown")
                        );
                        entry.operation.updated_at = now();
                        return LifecycleEventOutcome {
                            operation: Some(entry.operation.clone()),
                            boot_ack: Some(lifecycle_ack(&event)),
                        };
                    }
'''
          )

          replace_once(
              node_ops,
              '''fn complete_if_ready(entry: &mut RegistryEntry) -> bool {
    if !entry.saw_disconnect || entry.matching_boot_confirmation.is_none() {
        return false;
    }
''',
              '''fn complete_if_ready(entry: &mut RegistryEntry) -> bool {
    if entry.matching_boot_confirmation.is_none() {
        return false;
    }
'''
          )

          replace_once(
              node_ops,
              '''        assert_eq!(
            outcome.operation.unwrap().status,
            OperationStatus::Verifying,
            "confirmation alone must not complete an upgrade"
        );
        assert_eq!(
            confirmation_first.disconnected(1, "node-a")[0].status,
            OperationStatus::Success
        );
''',
              '''        assert_eq!(
            outcome.operation.unwrap().status,
            OperationStatus::Success,
            "exact authenticated confirmation is decisive even if disconnect was not observed"
        );
        assert!(confirmation_first.disconnected(1, "node-a").is_empty());
'''
          )

          replace_once(
              node_ops,
              '''        let mut wrong_version = matching_upgrade_boot(&operation);
        wrong_version.node_version = Some("9.9.9".into());
        let outcome = registry.event_from_authenticated_node(1, Some("node-a"), wrong_version);
        assert!(outcome.operation.is_none());
        assert!(outcome.boot_ack.is_none());

''',
              ''''''
          )

          replace_once(
              node_ops,
              '''        let first = registry.event_from_authenticated_node(
            1,
            Some("node-a"),
            matching_upgrade_boot(&operation),
        );
        let duplicate = registry.event_from_authenticated_node(
            1,
            Some("node-a"),
            matching_upgrade_boot(&operation),
        );
        assert!(first.boot_ack.is_some());
        assert!(duplicate.boot_ack.is_some());
        assert_eq!(
            registry.get(&operation.id).unwrap().status,
            OperationStatus::Verifying
        );
        registry.disconnected(1, "node-a");
        assert_eq!(
            registry.get(&operation.id).unwrap().status,
            OperationStatus::Success
        );
''',
              '''        let first = registry.event_from_authenticated_node(
            1,
            Some("node-a"),
            matching_upgrade_boot(&operation),
        );
        assert_eq!(
            first.operation.as_ref().unwrap().status,
            OperationStatus::Success
        );
        assert!(first.boot_ack.is_some());
        let duplicate = registry.event_from_authenticated_node(
            1,
            Some("node-a"),
            matching_upgrade_boot(&operation),
        );
        assert!(duplicate.operation.is_none());
        assert!(duplicate.boot_ack.is_some());
        assert_eq!(
            registry.get(&operation.id).unwrap().status,
            OperationStatus::Success
        );
        assert!(registry.disconnected(1, "node-a").is_empty());
'''
          )

          replace_once(
              node_ops,
              '''    #[test]
    fn early_upgrade_confirmation_rejects_wrong_correlation_and_is_idempotent() {
''',
              '''    #[test]
    fn upgrade_boot_confirmation_wrong_version_fails_without_disconnect() {
        let registry = NodeOperationRegistry::new();
        let operation = upgrade_operation(&registry);
        registry.event(
            1,
            lifecycle_event(&operation, NodeLifecycleEventStatus::Restarting),
        );
        let mut wrong_version = matching_upgrade_boot(&operation);
        wrong_version.node_version = Some("9.9.9".into());
        let outcome =
            registry.event_from_authenticated_node(1, Some("node-a"), wrong_version);
        assert_eq!(
            outcome.operation.unwrap().status,
            OperationStatus::Failed
        );
        assert!(outcome.boot_ack.is_some());
        assert_eq!(
            registry.get(&operation.id).unwrap().status,
            OperationStatus::Failed
        );
    }

    #[test]
    fn early_upgrade_confirmation_rejects_wrong_correlation_and_is_idempotent() {
'''
          )

          replace_once(
              node_ops,
              '''    #[test]
    fn upgrade_reconnect_requires_exact_target_version() {
''',
              '''    #[test]
    fn restart_exact_boot_confirmation_succeeds_without_observed_disconnect() {
        let registry = NodeOperationRegistry::new();
        let operation = start(&registry, "a", NodeLifecycleAction::Restart);
        registry.event(
            1,
            lifecycle_event(&operation, NodeLifecycleEventStatus::Restarting),
        );
        let outcome = registry.event_from_authenticated_node(
            1,
            Some("a"),
            lifecycle_event(&operation, NodeLifecycleEventStatus::Completed),
        );
        assert_eq!(
            outcome.operation.unwrap().status,
            OperationStatus::Success
        );
        assert!(outcome.boot_ack.is_some());
        assert!(registry.disconnected(1, "a").is_empty());
    }

    #[test]
    fn upgrade_reconnect_requires_exact_target_version() {
'''
          )

          replace_once("crates/panel/Cargo.toml", 'version = "1.1.2"', 'version = "1.1.3"')
          replace_once("crates/node/Cargo.toml", 'version = "1.1.2"', 'version = "1.1.3"')
          replace_once(
              "Cargo.lock",
              'name = "relay-node"\nversion = "1.1.2"',
              'name = "relay-node"\nversion = "1.1.3"'
          )
          replace_once(
              "Cargo.lock",
              'name = "relay-panel"\nversion = "1.1.2"',
              'name = "relay-panel"\nversion = "1.1.3"'
          )
          replace_all("scripts/relay-node-install.sh", "1.1.2", "1.1.3")
          replace_once("scripts/release-version-contract.test.sh", 'TAG="${1:-v1.1.2}"', 'TAG="${1:-v1.1.3}"')
          replace_all("docs/VERSIONS.md", "v1.1.2", "v1.1.3")
          replace_all("docs/VERSIONS.md", "release-check.sh 1.1.2", "release-check.sh 1.1.3")
          replace_all("README.md", "v1.1.2", "v1.1.3")

          panel_changelog = Path("CHANGELOG.md")
          panel = panel_changelog.read_text()
          if "## [1.1.3]" in panel:
              raise SystemExit("CHANGELOG.md already contains 1.1.3")
          marker = "---\n\n"
          entry = '''## [1.1.3] - 2026-09-06

生产热修复：修复 relay-node 已升级并重新认证上线后，Panel 仍可能因未观察到旧 WebSocket disconnect 而长期停留“等待上线”的生命周期竞态。

### 修复

- Restart / Upgrade 收到经过认证、operation / group / node / action 精确关联的 boot confirmation 后，不再把旧连接 disconnect 作为成功硬门槛。
- Upgrade 仍严格要求 boot confirmation 的 node version 与 target version 完全一致；版本不匹配会立即失败并 ACK，不再等待 disconnect。
- 保留 duplicate confirmation 幂等 ACK、Timeout 不重开、普通 reconnect 不可单独完成操作等既有安全边界。

### 兼容性

- 无数据库 migration。
- Config Protocol 保持 `10`。
- Lifecycle Protocol 保持 `1`。
- v1.1.2 可直接升级到 v1.1.3。

'''
          if marker not in panel:
              raise SystemExit("CHANGELOG.md marker missing")
          panel_changelog.write_text(panel.replace(marker, marker + entry, 1))

          node_changelog = Path("CHANGELOG-NODE.md")
          node = node_changelog.read_text()
          if "## [1.1.3]" in node:
              raise SystemExit("CHANGELOG-NODE.md already contains 1.1.3")
          node_entry = '''## [1.1.3] - 2026-09-06

统一版本热修复。Relay Node 运行时逻辑与协议不变；版本随 Panel 统一提升至 `1.1.3`。

### 兼容性

- Config Protocol 保持 `10`，Lifecycle Protocol 保持 `1`。
- v1.1.2 relay-node 可直接升级到 v1.1.3。

'''
          if marker not in node:
              raise SystemExit("CHANGELOG-NODE.md marker missing")
          node_changelog.write_text(node.replace(marker, marker + node_entry, 1))
          PY

          cargo fmt --all
          git diff --check
          bash scripts/release-version-contract.sh "$RELEASE_TAG"
          bash scripts/release-version-contract.test.sh "$RELEASE_TAG"
          bash scripts/release-check.sh "$RELEASE_VERSION"

      - name: Run locked release validation
        if: steps.guard.outputs.publish == 'true'
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked -- \
            --skip db::schema::tests::migration_skips_index_when_duplicates_exist \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_port_scoped_by_group \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_surfaces_port_unique_violation \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_tcp_udp_share_port
          sudo bash scripts/node-artifact-permissions.test.sh

      - name: Validate frontend
        if: steps.guard.outputs.publish == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Commit v1.1.3 hotfix source
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1.1.3-publish-once.yml
          git add \
            crates/panel/src/api/node_ops.rs \
            crates/panel/Cargo.toml \
            crates/node/Cargo.toml \
            Cargo.lock \
            scripts/relay-node-install.sh \
            scripts/release-version-contract.test.sh \
            CHANGELOG.md \
            CHANGELOG-NODE.md \
            docs/VERSIONS.md \
            README.md
          git diff --cached --check
          git commit -m "fix: release v1.1.3 lifecycle confirmation hotfix"
          git push origin HEAD:main

      - name: Create immutable v1.1.3 tag
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG unexpectedly appeared during publication" >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Reality Panel $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch verified binary release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run binary-release.yml --ref "$RELEASE_TAG"

      - name: Write publication summary
        if: steps.guard.outputs.publish == 'true'
        run: |
          {
            echo "## v1.1.3 lifecycle hotfix staged"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source: \`$(git rev-parse HEAD)\`"
            echo "- Binary Release workflow dispatched."
            echo "- This one-time workflow removed itself from final main."
          } >> "$GITHUB_STEP_SUMMARY"
