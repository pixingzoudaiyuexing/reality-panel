name: Apply v1.0.2 Public URL

on:
  push:
    branches: ["hotfix/v1.0.2"]

permissions:
  contents: write

concurrency:
  group: apply-v1.0.2-public-url
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.0.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply patch
        run: python3 .github/scripts/apply-v1.0.2-public-url.py
      - name: Rust format
        run: cargo fmt --all
      - name: Rust check
        run: cargo check --workspace --locked
      - name: Public URL regression tests
        run: cargo test -p relay-panel --locked public_panel_url
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit verified change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-v1.0.2-public-url.py .github/workflows/apply-v1.0.2-public-url.yml
          git add crates frontend
          git diff --cached --check
          git commit -m "feat: add configurable panel public URL"
          git push origin HEAD:hotfix/v1.0.2
