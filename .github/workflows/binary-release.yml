name: Reality Panel Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reality-panel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and publish verified amd64 release
    runs-on: ubuntu-24.04
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        run: |
          rustup show
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file openssl sqlite3
          rm -rf /var/lib/apt/lists/*

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate source and package versions
        id: release-meta
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/panel/Cargo.toml | head -n1)"
            RELEASE_TAG="v$VERSION"
          fi
          bash scripts/release-check.sh "${RELEASE_TAG#v}"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run locked workspace tests
        run: |
          # These four pre-existing SQLite tests are the documented historical
          # baseline. All other workspace tests remain release-blocking.
          cargo test --workspace --locked -- \
            --skip db::schema::tests::migration_skips_index_when_duplicates_exist \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_port_scoped_by_group \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_surfaces_port_unique_violation \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_tcp_udp_share_port

      - name: Build Linux amd64 binaries from this checkout
        run: cargo build --release --locked -p relay-panel -p relay-node

      - name: Test and build frontend from this checkout
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Verify Linux node artifact permission contract
        run: bash scripts/node-artifact-permissions.test.sh

      - name: Assemble release assets
        run: |
          mkdir -p release-dist/web
          cp target/release/relay-panel release-dist/reality-panel-linux-amd64
          cp target/release/relay-node release-dist/reality-node-linux-amd64
          tar -czf release-dist/reality-panel-web.tar.gz -C frontend/dist .
          cp install.sh deploy.sh update.sh scripts/relay-node-install.sh release-dist/
          sed -i "s/^DEFAULT_RELEASE_TAG=.*/DEFAULT_RELEASE_TAG=\"$RELEASE_TAG\"/" release-dist/install.sh
          printf '%s\n' "$GITHUB_SHA" > release-dist/SOURCE_COMMIT
          chmod +x release-dist/reality-panel-linux-amd64 release-dist/reality-node-linux-amd64
          chmod +x release-dist/install.sh release-dist/deploy.sh release-dist/update.sh release-dist/relay-node-install.sh
          test "$(release-dist/reality-panel-linux-amd64 --version | awk '{print $NF}')" = "$VERSION"
          test "$(release-dist/reality-node-linux-amd64 --version | awk '{print $NF}')" = "$VERSION"
          file release-dist/reality-panel-linux-amd64 | grep -q 'ELF 64-bit.*x86-64'
          file release-dist/reality-node-linux-amd64 | grep -q 'ELF 64-bit.*x86-64'
          test -s release-dist/reality-panel-web.tar.gz
          (cd release-dist && sha256sum reality-panel-linux-amd64 reality-node-linux-amd64 reality-panel-web.tar.gz install.sh deploy.sh update.sh relay-node-install.sh SOURCE_COMMIT > SHA256SUMS)

      - name: Verify release assets
        run: |
          cd release-dist
          sha256sum -c SHA256SUMS
          test "$(tar -tzf reality-panel-web.tar.gz | grep -c '^./index.html$')" -eq 1
          grep -Eq '^([0-9a-f]{64})  reality-panel-linux-amd64$' SHA256SUMS
          grep -Eq '^([0-9a-f]{64})  reality-node-linux-amd64$' SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reality-panel-${{ steps.release-meta.outputs.version }}-linux-amd64-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Reality Panel ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-dist/reality-panel-linux-amd64
            release-dist/reality-node-linux-amd64
            release-dist/reality-panel-web.tar.gz
            release-dist/install.sh
            release-dist/update.sh
            release-dist/deploy.sh
            release-dist/relay-node-install.sh
            release-dist/SHA256SUMS
            release-dist/SOURCE_COMMIT
