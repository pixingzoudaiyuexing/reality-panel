name: v1.4.5 Frontend Blocker Confirmation
on:
  push:
    branches: ['codex/v145-publication-build-only']
permissions:
  contents: read
jobs:
  frontend-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9a498c8c64f178d496a3f982d2e206adfc6b203
      - name: Exact final source
        run: |
          test "$(git rev-parse HEAD)" = "a9a498c8c64f178d496a3f982d2e206adfc6b203"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fresh dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Full frontend validation
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Isolated previously failing cases
        working-directory: frontend
        run: |
          npx vitest run src/pages/NodeBootstrap.test.tsx -t 'binds confirmed installation'
          npx vitest run src/pages/NodeBootstrap.test.tsx -t 'shows the new identity'
          npx vitest run src/pages/NodeBootstrap.test.tsx -t 'labels ambiguous authority'
      - name: Ten consecutive file runs
        working-directory: frontend
        run: |
          for iteration in $(seq 1 10); do
            printf 'STABILITY_RUN=%s\n' "$iteration"
            npx vitest run src/pages/NodeBootstrap.test.tsx
          done
      - name: Carrier progress/error/refresh targeted regression
        working-directory: frontend
        run: npx vitest run src/components/nodes/CarrierAffinityPanel.test.tsx src/components/nodes/carrierOperation.test.ts
