name: v1.4.10 isolated build and verification only
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v1410-isolated-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaytest
          POSTGRES_PASSWORD: relaytest
          POSTGRES_DB: relaytest
        options: >-
          --health-cmd "pg_isready -U relaytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_URL: postgres://relaytest:relaytest@postgres:5432/relaytest
      FROZEN_SOURCE: ${{ inputs.source }}
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve helper and check out frozen product source
        run: |
          cp scripts/v1410-publication-builder.py "$RUNNER_TEMP/builder.py"
          [[ "$FROZEN_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git checkout --detach "$FROZEN_SOURCE"
          test -z "$(git status --porcelain)"
      - name: Existing Debian12 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file openssl sqlite3 pkg-config libssl-dev libssh2-1-dev zlib1g-dev python3 postgresql-client
          rustup show
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: v1410-linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: v1410-linux-cargo-
      - name: No-skip locked gates and optimized ten-asset build
        run: python3 "$RUNNER_TEMP/builder.py"
      - name: Preserve diagnostics and verified assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1410-verified-${{ inputs.source }}
          path: |
            publication-evidence/
            release-dist/
          if-no-files-found: error
          retention-days: 14
