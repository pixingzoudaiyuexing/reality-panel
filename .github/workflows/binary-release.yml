name: Reality Panel v1.4.6 Frozen Publication Build

on:
  push:
    branches: ['codex/v146-publication-build-only']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reality-panel-v146-publication-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_TEST_THREADS: 1
jobs:
  build:
    name: Validate and build exact frozen Linux amd64 source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb84e958c77960965f7f3c896734201180e3987a
      - name: Prepare Debian toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file openssl sqlite3 python3
          rustup component add rustfmt clippy
          rm -rf /var/lib/apt/lists/*
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Exact source and environment
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = fb84e958c77960965f7f3c896734201180e3987a
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          cat /etc/os-release
          uname -m
          test "$(uname -m)" = x86_64
          rustc --version
          cargo --version
          node --version
          npm --version
          printf 'SOURCE_SHA=fb84e958c77960965f7f3c896734201180e3987a\nRELEASE_TAG=v1.4.6\nVERSION=1.4.6\n' >> "$GITHUB_ENV"
      - name: Build-network recovery and locked dependency preflight
        run: |
          getent ahostsv4 static.crates.io
          getent ahostsv4 index.crates.io
          getent ahostsv4 registry.npmjs.org
          python3 - <<'PY'
          import urllib.request
          for url in ['https://static.crates.io/crates/bit-vec/0.9.1/download','https://index.crates.io/config.json','https://registry.npmjs.org/typescript']:
              with urllib.request.urlopen(url,timeout=30) as response:
                  data=response.read()
                  assert response.status==200 and data
                  print('NETWORK_PREFLIGHT_PASS',url,len(data))
          PY
          cargo fetch --locked
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Locked workspace check
        run: cargo check --workspace --locked
      - name: Locked complete workspace tests
        run: cargo test --workspace --locked
      - name: Clippy all targets warnings gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Static and release contracts
        run: |
          while IFS= read -r script; do bash -n "$script"; done < <(git -c safe.directory="$GITHUB_WORKSPACE" ls-files '*.sh')
          python3 scripts/relay-node-existing-install.test.py
          bash scripts/check-repo-test-parity.sh
          bash scripts/release-version-contract.sh v1.4.6
          bash scripts/release-version-contract.test.sh v1.4.6
          bash scripts/release-check.sh 1.4.6
      - name: Fresh frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Full frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Optimized Linux release build
        run: cargo build --release --locked -p relay-panel -p relay-node
      - name: Artifact permission contract
        run: bash scripts/node-artifact-permissions.test.sh
      - name: Assemble official assets from frozen source
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          mkdir release-dist
          cp target/release/relay-panel release-dist/reality-panel-linux-amd64
          cp target/release/relay-node release-dist/reality-node-linux-amd64
          tar -czf release-dist/reality-panel-web.tar.gz -C frontend/dist .
          cp install.sh deploy.sh update.sh scripts/relay-node-install.sh release-dist/
          sed -i "s/^DEFAULT_RELEASE_TAG=.*/DEFAULT_RELEASE_TAG=\"$RELEASE_TAG\"/" release-dist/install.sh
          printf '%s\n' "$SOURCE_SHA" > release-dist/SOURCE_COMMIT
          printf '%s\n' "$VERSION" > release-dist/VERSION
          chmod 0755 release-dist/reality-panel-linux-amd64 release-dist/reality-node-linux-amd64 release-dist/*.sh
          (cd release-dist && sha256sum reality-panel-linux-amd64 reality-node-linux-amd64 reality-panel-web.tar.gz install.sh deploy.sh update.sh relay-node-install.sh SOURCE_COMMIT VERSION > SHA256SUMS)
      - name: Validate checksums binaries and clean Linux web archive
        run: |
          cd release-dist
          sha256sum -c SHA256SUMS
          test "$(./reality-panel-linux-amd64 --version)" = 'relay-panel 1.4.6'
          test "$(./reality-node-linux-amd64 --version)" = 'relay-node 1.4.6'
          file reality-panel-linux-amd64 reality-node-linux-amd64 | tee ../file-types.log
          test "$(grep -c 'ELF 64-bit.*x86-64' ../file-types.log)" = 2
          test "$(cat SOURCE_COMMIT)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "$VERSION"
          tar -tzf reality-panel-web.tar.gz > ../web-tar-listing.log
          test "$(grep -c '^./index.html$' ../web-tar-listing.log)" = 1
          mkdir ../web-extracted
          tar -xzf reality-panel-web.tar.gz -C ../web-extracted 2> ../web-extract.stderr
          test ! -s ../web-extract.stderr
          diff -qr ../frontend/dist ../web-extracted
          test -s ../web-extracted/index.html
          test -d ../web-extracted/assets
          python3 - <<'PY'
          import tarfile
          with tarfile.open('reality-panel-web.tar.gz') as tf:
              assert all(not member.pax_headers and not any(part.startswith('._') or part=='__MACOSX' for part in member.name.split('/')) for member in tf)
          print('WEB_ARCHIVE_CLEAN=PASS; GNU_TAR_EXTRACTION_WARNING_BYTES=0')
          PY
      - name: Upload verified official assets
        uses: actions/upload-artifact@v4
        with:
          name: reality-panel-1.4.6-formal-linux-amd64-fb84e958c779
          path: release-dist/
          if-no-files-found: error
          retention-days: 14
