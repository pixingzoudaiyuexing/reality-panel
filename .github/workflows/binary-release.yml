name: v1.4.12 exact source upload only
on:
  workflow_dispatch:
    inputs:
      bundle:
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and import exact authorized Git objects
        env:
          BUNDLE_DATA: ${{ inputs.bundle }}
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,os,pathlib,subprocess
          bundle=base64.b64decode(os.environ['BUNDLE_DATA'],validate=True)
          assert hashlib.sha256(bundle).hexdigest() == '1ff4dad0695c732f55a29ca6487c842b20d00a2bad66fcb0d1c066e655f932bc'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'authorized-source.bundle'
          path.write_bytes(bundle)
          subprocess.run(['git','bundle','verify',str(path)],check=True)
          subprocess.run(['git','fetch',str(path),'HEAD'],check=True)
          head='168a5aba304cb1e7637940929c5c61a8ecf0488f'
          subprocess.run(['git','merge-base','--is-ancestor','60435568b189358d58f821710dc445c9324c6980',head],check=True)
          subprocess.run(['git','cat-file','-e',head+'^{commit}'],check=True)
          assert subprocess.check_output(['git','rev-parse',head+'^{tree}'],text=True).strip()=='407ebf2c20d36054534b25f0ca61a6a4560a900e'
          subprocess.run(['git','push','origin',head+':refs/heads/codex/v1412-ssh-probe-fix'],check=True)
          print('EXACT 168a5aba304cb1e7637940929c5c61a8ecf0488f SOURCE UPLOADED',head)
          PYCODE
