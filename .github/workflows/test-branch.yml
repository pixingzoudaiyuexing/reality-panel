name: Harden Upgrade Only Channel

on:
  push:
    branches:
      - fix/protocol-independent-node-upgrade

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/protocol-independent-node-upgrade
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply hardening
        run: python3 .github/scripts/harden_upgrade_only.py

      - name: Validate Rust
        run: |
          cargo fmt --all
          cargo test -p relay-shared control_protocol -- --nocapture
          cargo test -p relay-panel api::ws::tests -- --nocapture
          cargo check --workspace
          git diff --check

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --run
          npm run typecheck

      - name: Commit validated hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/panel/src/api/ws.rs frontend/src/components/nodes/upgrade.ts crates/shared/src/control_protocol.rs
          git diff --cached --check
          git commit -m 'test: 固化跨配置协议节点升级不变量 [skip ci]'
          git push origin HEAD:fix/protocol-independent-node-upgrade
