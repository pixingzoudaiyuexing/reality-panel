name: Prepare v1.0.1 Hotfix

on:
  push:
    branches: ["hotfix/v1.0.1"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.0.1
          fetch-depth: 0
      - name: Prepare release metadata
        run: bash scripts/prepare-v1.0.1.sh
