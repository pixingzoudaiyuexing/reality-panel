name: v1.4.6 Frozen PostgreSQL Publication Validation
on:
  push:
    branches: ['codex/v146-publication-pg-validation-only']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_TEST_THREADS: 1
jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.96-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaytest
          POSTGRES_PASSWORD: relaytest
          POSTGRES_DB: relaytest
        options: >-
          --health-cmd "pg_isready -U relaytest -d relaytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_URL: postgres://relaytest:relaytest@postgres:5432/relaytest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb84e958c77960965f7f3c896734201180e3987a
      - name: Exact frozen source and PostgreSQL availability
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = fb84e958c77960965f7f3c896734201180e3987a
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          test "$(uname -m)" = x86_64
          test -n "$TEST_PG_URL"
          python3 - <<'PYTHON'
          import socket
          with socket.create_connection(('postgres',5432),timeout=10):
              print('POSTGRES_SERVICE_SOCKET_PASS')
          PYTHON
          rustc --version
          cargo --version
      - name: Locked dependency preflight
        run: |
          getent ahostsv4 static.crates.io
          cargo fetch --locked
      - name: Complete workspace tests with real PostgreSQL contracts
        run: cargo test --workspace --locked
      - name: Frozen source integrity after tests
        run: |
          printf 'SOURCE_HEAD='; git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain --untracked-files=all
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = fb84e958c77960965f7f3c896734201180e3987a
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
