name: RC2 Finalize

on:
  push:
    branches:
      - hotfix/v1.1.0-rc.2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.1.0-rc.2
          fetch-depth: 0

      - name: Add durable runtime directory contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # The primary bootstrap owns the systemd service contract. RuntimeDirectory
          # guarantees /run/relay-node is recreated whenever relay-node starts after
          # reboot. The node binary also self-heals before nginx -t, so upgraded old
          # units that do not yet contain this directive remain recoverable.
          replace_once(
              "scripts/relay-node-bootstrap.sh",
              '''[Service]\nType=simple\nEnvironmentFile=$install_dir/relay-node.env\nWorkingDirectory=$install_dir\nExecStart=$install_dir/relay-node\nRestart=always\nRestartSec=3\nLimitNOFILE=65536\n''',
              '''[Service]\nType=simple\nRuntimeDirectory=relay-node\nRuntimeDirectoryMode=0755\nEnvironmentFile=$install_dir/relay-node.env\nWorkingDirectory=$install_dir\nExecStart=$install_dir/relay-node\nRestart=always\nRestartSec=3\nLimitNOFILE=65536\n''')

          # Keep the deprecated compatibility installer safe for operators that still
          # use it, and fix its rc.2 usage example while touching only release-local
          # documentation/runtime contract lines.
          replace_once(
              "scripts/relay-node-install.sh",
              '''[Service]\nType=simple\nWorkingDirectory=${INSTALL_DIR}\nExecStart=/bin/bash ${START_SH}\nRestart=always\nRestartSec=3\nLimitNOFILE=65536\n''',
              '''[Service]\nType=simple\nRuntimeDirectory=relay-node\nRuntimeDirectoryMode=0755\nWorkingDirectory=${INSTALL_DIR}\nExecStart=/bin/bash ${START_SH}\nRestart=always\nRestartSec=3\nLimitNOFILE=65536\n''')
          replace_once(
              "scripts/relay-node-install.sh",
              '--version 1.1.0-rc.1',
              '--version 1.1.0-rc.2')
          PY

          bash -n scripts/relay-node-bootstrap.sh
          bash -n scripts/relay-node-install.sh
          git diff --check

      - name: Validate bootstrap and installer contracts
        shell: bash
        run: |
          bash scripts/relay-node-bootstrap.test.sh
          bash scripts/install-update.test.sh
          grep -Fq 'RuntimeDirectory=relay-node' scripts/relay-node-bootstrap.sh
          grep -Fq 'RuntimeDirectoryMode=0755' scripts/relay-node-bootstrap.sh
          grep -Fq 'RuntimeDirectory=relay-node' scripts/relay-node-install.sh
          grep -Fq -- '--version 1.1.0-rc.2' scripts/relay-node-install.sh
          bash scripts/release-version-contract.sh v1.1.0-rc.2

      - name: Commit runtime contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/relay-node-bootstrap.sh scripts/relay-node-install.sh
          git commit -m "fix: recreate relay runtime directory after reboot"
          git push origin HEAD:hotfix/v1.1.0-rc.2
