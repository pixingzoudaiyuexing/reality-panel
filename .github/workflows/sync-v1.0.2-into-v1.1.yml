name: Sync v1.0.2 into v1.1 RC

on:
  push:
    branches:
      - feature/v1.1-relay-preference

permissions:
  contents: write

concurrency:
  group: sync-v1.0.2-into-v1.1
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.1-relay-preference
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge main and resolve known overlap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 && ! -f .git/MERGE_HEAD ]]; then
            exit "$merge_rc"
          fi
          for path in crates/panel/src/api/admin/mod.rs frontend/src/api/types.ts frontend/src/i18n/en-US.ts frontend/src/i18n/zh-CN.ts; do
            if git ls-files -u -- "$path" | grep -q .; then
              git checkout --ours -- "$path"
            fi
          done
          python3 .github/scripts/sync-v1.0.2-into-v1.1.py
          grep -q 'pub public_panel_url: String' crates/panel/src/service/site.rs
          grep -q 'effective_public_panel_url' crates/panel/src/api/provisioning.rs
          grep -q 'public_panel_url: string;' frontend/src/api/types.ts
          grep -q "panelPublicUrl: 'Panel public URL'" frontend/src/i18n/en-US.ts
          grep -q "panelPublicUrl: '面板公网地址'" frontend/src/i18n/zh-CN.ts
          grep -q 'name="public_panel_url"' frontend/src/pages/SiteSettings.tsx
          grep -q 'version = "1.1.0-rc.1"' crates/panel/Cargo.toml
          grep -q 'version = "1.1.0-rc.1"' crates/node/Cargo.toml
          git rm .github/scripts/sync-v1.0.2-into-v1.1.py .github/workflows/sync-v1.0.2-into-v1.1.yml
          git add crates/panel/src/api/admin/mod.rs crates/panel/src/api/node_deploy.rs crates/panel/src/api/node_enrollment.rs crates/panel/src/api/provisioning.rs crates/panel/src/api/site.rs crates/panel/src/service/site.rs frontend/src/api/types.ts frontend/src/i18n/en-US.ts frontend/src/i18n/zh-CN.ts frontend/src/pages/SiteSettings.tsx
          git diff --cached --check
      - name: Rust verification
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test -p relay-panel --locked public_panel_url
          bash scripts/release-version-contract.sh v1.1.0-rc.1
          bash scripts/check-repo-test-parity.sh
          bash scripts/release-check.sh
          git diff --check
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Commit merge and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "merge: carry v1.0.2 hotfix into v1.1 rc"
          git push origin HEAD:feature/v1.1-relay-preference
