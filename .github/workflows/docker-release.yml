name: Docker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: reality-panel-docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PANEL_IMAGE: ghcr.io/pixingzoudaiyuexing/relay-panel-panel
  NODE_IMAGE: ghcr.io/pixingzoudaiyuexing/relay-panel-node

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Validate release contract
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/panel/Cargo.toml | head -n1)"
            TAG="v$VERSION"
          fi
          VERSION="${TAG#v}"
          bash scripts/release-version-contract.sh "$TAG"
          bash scripts/release-check.sh "$VERSION"
          STABLE=true
          [[ "$VERSION" == *-* ]] && STABLE=false
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'stable=%s\n' "$STABLE" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build verified frontend
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
          test -s dist/index.html

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: docker-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  native:
    name: Build native ${{ matrix.arch }} binaries
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates file pkg-config libssl-dev libssh2-1-dev zlib1g-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Build locked release binaries
        run: cargo build --release --locked -p relay-panel -p relay-node

      - name: Verify binary versions and architecture
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(target/release/relay-panel --version | awk '{print $NF}')" = "$VERSION"
          test "$(target/release/relay-node --version | awk '{print $NF}')" = "$VERSION"
          if [[ "$ARCH" == amd64 ]]; then
            file target/release/relay-panel | grep -q 'ELF 64-bit.*x86-64'
            file target/release/relay-node | grep -q 'ELF 64-bit.*x86-64'
          else
            file target/release/relay-panel | grep -Eq 'ELF 64-bit.*(ARM aarch64|aarch64)'
            file target/release/relay-node | grep -Eq 'ELF 64-bit.*(ARM aarch64|aarch64)'
          fi

      - name: Upload panel binary
        uses: actions/upload-artifact@v4
        with:
          name: docker-panel-${{ matrix.arch }}-${{ github.sha }}
          path: target/release/relay-panel
          if-no-files-found: error
          retention-days: 3

      - name: Upload node binary
        uses: actions/upload-artifact@v4
        with:
          name: docker-node-${{ matrix.arch }}-${{ github.sha }}
          path: target/release/relay-node
          if-no-files-found: error
          retention-days: 3

  publish-arch:
    name: Publish ${{ matrix.arch }} images
    needs: [metadata, frontend, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: docker-frontend-${{ github.sha }}
          path: release-dist/frontend

      - name: Download current panel binary
        uses: actions/download-artifact@v4
        with:
          name: docker-panel-${{ matrix.arch }}-${{ github.sha }}
          path: release-dist/panel

      - name: Download amd64 node binary
        uses: actions/download-artifact@v4
        with:
          name: docker-node-amd64-${{ github.sha }}
          path: release-dist/node-assets/amd64

      - name: Download arm64 node binary
        uses: actions/download-artifact@v4
        with:
          name: docker-node-arm64-${{ github.sha }}
          path: release-dist/node-assets/arm64

      - name: Assemble verified Docker release context
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod 0755 release-dist/panel/relay-panel
          for node_arch in amd64 arm64; do
            node="release-dist/node-assets/$node_arch/relay-node"
            chmod 0755 "$node"
            sha="$(sha256sum "$node" | awk '{print $1}')"
            size="$(wc -c < "$node")"
            printf '{"version":"%s","sha256":"%s","size":%s}\n' \
              "$VERSION" "$sha" "$size" \
              > "release-dist/node-assets/$node_arch/metadata.json"
          done
          mkdir -p release-dist/node
          cp "release-dist/node-assets/$ARCH/relay-node" release-dist/node/relay-node
          chmod 0755 release-dist/node/relay-node
          test -s release-dist/frontend/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture images
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "$PLATFORM" \
            --target panel-release \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --tag "$PANEL_IMAGE:$TAG-$ARCH" \
            .
          docker buildx build \
            --platform "$PLATFORM" \
            --target node-release \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --tag "$NODE_IMAGE:$TAG-$ARCH" \
            .

  manifest:
    name: Publish multi-arch manifests
    needs: [metadata, publish-arch]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable and stable aliases
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          STABLE: ${{ needs.metadata.outputs.stable }}
        run: |
          set -euo pipefail

          publish_manifest() {
            local image="$1"
            local alias="$2"
            docker buildx imagetools create \
              --tag "$image:$alias" \
              "$image:$TAG-amd64" \
              "$image:$TAG-arm64"
          }

          for image in "$PANEL_IMAGE" "$NODE_IMAGE"; do
            publish_manifest "$image" "$TAG"
            publish_manifest "$image" "$VERSION"

            if [[ "$STABLE" == true ]]; then
              IFS='.' read -r major minor patch <<< "$VERSION"
              publish_manifest "$image" "$major.$minor"
              publish_manifest "$image" "$major"
              publish_manifest "$image" latest
            fi

            docker buildx imagetools inspect "$image:$TAG"
          done

      - name: Write release summary
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          STABLE: ${{ needs.metadata.outputs.stable }}
        run: |
          {
            echo "## Docker release published"
            echo
            echo "- Panel: \`$PANEL_IMAGE:$TAG\`"
            echo "- Node: \`$NODE_IMAGE:$TAG\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            if [[ "$STABLE" == true ]]; then
              echo "- Stable aliases: \`$VERSION\`, \`latest\` (plus major/minor aliases)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
