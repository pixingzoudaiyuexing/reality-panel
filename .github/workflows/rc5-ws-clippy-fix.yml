name: rc5 WS Clippy Fix

on:
  push:
    branches:
      - fix/protocol-independent-node-upgrade

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/protocol-independent-node-upgrade
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply scoped WS clippy fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/panel/src/api/ws.rs')
          s = p.read_text()
          old = '''    pub async fn register(\n'''
          new = '''    #[cfg(test)]\n    pub async fn register(\n'''
          if s.count(old) != 1:
              raise SystemExit('register marker mismatch')
          s = s.replace(old, new, 1)
          old = '''async fn handle_node_ws(\n'''
          new = '''// 连接处理需要同时携带认证后的节点元数据、协议能力与共享运行态。\n// 这些参数属于同一个 WS 生命周期，当前保持显式传递以避免为 rc.5 引入无关重构。\n#[allow(clippy::too_many_arguments)]\nasync fn handle_node_ws(\n'''
          if s.count(old) != 1:
              raise SystemExit('handle_node_ws marker mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate scoped change
        run: |
          cargo fmt --all
          cargo check --workspace --locked
          cargo test -p relay-panel api::ws::tests --locked -- --nocapture
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/panel/src/api/ws.rs
          git commit -m 'fix: 收紧 rc.5 WS clippy 边界 [skip ci]'
          git push origin HEAD:fix/protocol-independent-node-upgrade
