name: RC6 Release Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: reality-panel-rc6-release-once
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_SHA: 24f74d7b5bbb5281b66fe052e7d6b0e8f881b96f
  RELEASE_TAG: v1.1.0-rc.6

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    name: Build and publish verified rc6
    runs-on: ubuntu-24.04
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Install release dependencies
        run: |
          rustup show
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file openssl sqlite3 git
          rm -rf /var/lib/apt/lists/*

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release source and versions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/release-version-contract.sh "$RELEASE_TAG"
          cargo fmt --all -- --check
          cargo check --workspace --locked

      - name: Run locked workspace tests
        run: |
          cargo test --workspace --locked -- \
            --skip db::schema::tests::migration_skips_index_when_duplicates_exist \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_port_scoped_by_group \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_surfaces_port_unique_violation \
            --skip db::sqlite_repo::tests::rule_insert_quota_guarded_tcp_udp_share_port

      - name: Build Linux amd64 binaries
        run: cargo build --release --locked -p relay-panel -p relay-node

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Verify Linux node artifact permission contract
        run: bash scripts/node-artifact-permissions.test.sh

      - name: Assemble and verify release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-dist
          cp target/release/relay-panel release-dist/reality-panel-linux-amd64
          cp target/release/relay-node release-dist/reality-node-linux-amd64
          tar -czf release-dist/reality-panel-web.tar.gz -C frontend/dist .
          cp install.sh deploy.sh update.sh scripts/relay-node-install.sh release-dist/
          sed -i "s/^DEFAULT_RELEASE_TAG=.*/DEFAULT_RELEASE_TAG=\"$RELEASE_TAG\"/" release-dist/install.sh
          chmod +x release-dist/reality-panel-linux-amd64 release-dist/reality-node-linux-amd64
          chmod +x release-dist/install.sh release-dist/deploy.sh release-dist/update.sh release-dist/relay-node-install.sh
          test "$(release-dist/reality-panel-linux-amd64 --version | awk '{print $NF}')" = "$VERSION"
          test "$(release-dist/reality-node-linux-amd64 --version | awk '{print $NF}')" = "$VERSION"
          file release-dist/reality-panel-linux-amd64 | grep -q 'ELF 64-bit.*x86-64'
          file release-dist/reality-node-linux-amd64 | grep -q 'ELF 64-bit.*x86-64'
          test -s release-dist/reality-panel-web.tar.gz
          (cd release-dist && sha256sum reality-panel-linux-amd64 reality-node-linux-amd64 reality-panel-web.tar.gz install.sh deploy.sh update.sh relay-node-install.sh > SHA256SUMS)
          (cd release-dist && sha256sum -c SHA256SUMS)
          test "$(tar -tzf release-dist/reality-panel-web.tar.gz | grep -c '^./index.html$')" -eq 1

      - name: Create exact release tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git -C "$GITHUB_WORKSPACE" rev-list -n1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            git -C "$GITHUB_WORKSPACE" tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Reality Panel $RELEASE_TAG"
            git -C "$GITHUB_WORKSPACE" push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-rc.6
          name: Reality Panel v1.1.0-rc.6
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release-dist/reality-panel-linux-amd64
            release-dist/reality-node-linux-amd64
            release-dist/reality-panel-web.tar.gz
            release-dist/install.sh
            release-dist/update.sh
            release-dist/deploy.sh
            release-dist/relay-node-install.sh
            release-dist/SHA256SUMS
