name: RC6 Patch Driver

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: reality-panel-rc6-patch-driver
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    name: Patch and verify wildcard desired validation
    runs-on: ubuntu-24.04
    container: rust:1.96-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out rc6 fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/wildcard-config-validation-rc6
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 scripts/rc6-wildcard-fix.py
          rm -f .github/workflows/rc6-wildcard-fix-once.yml
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Run targeted wildcard regression tests
        run: |
          cargo test --locked -p relay-node poller::tests::wildcard_certificate_domain -- --nocapture
          cargo test --locked -p relay-node certificate_lifecycle::tests -- --nocapture

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Commit verified fix branch
        run: |
          rm -f scripts/rc6-wildcard-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 接受覆盖 SNI 的通配符证书配置"
          git push origin HEAD:fix/wildcard-config-validation-rc6
