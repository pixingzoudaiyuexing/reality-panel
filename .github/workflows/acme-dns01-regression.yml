name: ACME DNS-01 Regression

on:
  pull_request:
    branches: [main]

jobs:
  acme-dns01:
    name: Multi-relay DNS-01 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Panel ACME DNS-01 tests
        run: cargo test --locked -p relay-panel acme_dns01 -- --nocapture
      - name: Node ACME DNS-01 hook tests
        run: cargo test --locked -p relay-node acme_dns01 -- --nocapture
