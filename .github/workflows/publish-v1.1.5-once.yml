name: Publish v1.1.5 Once

on:
  push:
    branches:
      - v1.1.5-publisher
    paths:
      - '.github/workflows/publish-v1.1.5-once.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dfc40526c24f3e14a44d27f4660e34f04381142f"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/panel/Cargo.toml | head -n1)" = "1.1.5"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/node/Cargo.toml | head -n1)" = "1.1.5"
          bash scripts/release-check.sh 1.1.5

      - name: Create and push v1.1.5 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.5 >/dev/null 2>&1; then
            echo "v1.1.5 already exists; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.1.5 -m "Reality Panel v1.1.5"
          git push origin refs/tags/v1.1.5
