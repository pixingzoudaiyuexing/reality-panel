name: Publish v1.1.5 Once

on:
  push:
    branches:
      - v1.1.5-publisher
    paths:
      - '.github/workflows/publish-v1.1.5-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dfc40526c24f3e14a44d27f4660e34f04381142f"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/panel/Cargo.toml | head -n1)" = "1.1.5"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/node/Cargo.toml | head -n1)" = "1.1.5"
          bash scripts/release-check.sh 1.1.5

      - name: Ensure v1.1.5 tag exists
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.1.5 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.1.5 -m "Reality Panel v1.1.5"
            git push origin refs/tags/v1.1.5
          fi

      - name: Trigger official binary release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/binary-release.yml/dispatches" \
            -d '{"ref":"v1.1.5"}'
