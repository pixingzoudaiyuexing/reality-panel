              'docs/NODE.zh-CN.md',
              '''控制协议保持版本 8。Reality `xver=0` 与可选的 Relay 到后端 HAProxy\nPROXY protocol 是两套机制。启用 PROXY 时，先在远端 Reality/Xray 后端启用\n''',
              '''配置协议当前为 v9；节点生命周期/一键升级使用独立的 Lifecycle Protocol v1，\n两者不得绑定升级。配置协议不兼容时，已具备 lifecycle 能力的托管 Node 仍可建立\n**upgrade-only** 控制通道：继续使用本地 LKG，不接收新配置、诊断、重启或卸载命令，\n但 Panel 必须仍能向它下发经过版本、架构和 SHA-256 校验的一键升级。这样未来配置协议\n从 v9 升到 v10/v20 时，不会再次出现“因为需要升级，所以反而无法升级”的死锁。\n\nReality `xver=0` 与可选的 Relay 到后端 HAProxy PROXY protocol 是两套机制。启用 PROXY 时，先在远端 Reality/Xray 后端启用\n''',
          )

      - name: Format
        run: cargo fmt --all

      - name: Targeted Rust tests
        run: |
          cargo test -p relay-shared control_protocol -- --nocapture
          cargo test -p relay-panel upgrade_only_connection_receives_upgrade_but_no_config_control -- --nocapture
          cargo test -p relay-panel modern_reality_panel_lifecycle_uses_semver_and_current_protocol -- --nocapture
          cargo check --workspace

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/shared/src/control_protocol.rs crates/shared/src/lib.rs crates/node/src/ws_client.rs crates/panel/src/api/ws.rs crates/panel/src/api/node_ops.rs frontend/src/components/nodes/NodeDesktopTable.tsx docs/NODE.zh-CN.md
          git diff --cached --check
          git commit -m 'fix: 配置协议升级时保留节点一键升级通道 [skip ci]'
          git push origin HEAD:fix/protocol-independent-node-upgrade
