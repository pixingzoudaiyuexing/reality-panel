[package]
name = "relay-panel"
version = "1.0.0-rc.3"
edition = "2021"
license.workspace = true

[dependencies]
relay-shared = { path = "../shared" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
bcrypt = "0.16"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
# Already in the tree transitively; taken as a direct dep so the password
# generator draws from the OS CSPRNG explicitly rather than through uuid.
getrandom = "0.2"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md-5 = "0.10"
# v1.2.0: SMTP for node-offline email alerts. default-features off so it uses
# rustls (matching reqwest above) instead of pulling in native-tls/OpenSSL,
# which would break the static musl node/panel builds.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "hostname"] }
# Stage 1 uses SSH password authentication only inside the in-memory deployment
# worker. ssh2 exposes the server host key before authentication, which lets us
# enforce the administrator-confirmed SHA-256 fingerprint before any mutation.
ssh2 = "0.9"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
subtle = "2"
tar = "0.4"
hickory-resolver = "0.24"

[dev-dependencies]
# tower::ServiceExt (.oneshot) for the security-headers router tests. Already in
# the dep tree via axum; listed here so the path resolves in test code.
tower = { version = "0.5", features = ["util"] }
